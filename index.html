<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>D&D Art Studio</title>
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Blocker / Instructions overlay -->
  <div id="blocker">
    <div id="instructions">
      <img src="/paintings/logo.jpg" alt="D&D Art Studio" id="studio-logo" />
      <h1>D&D Art Studio</h1>
      <p>Click to enter</p>
      <p class="controls-info">
        Move: WASD / Arrow Keys<br/>
        Look: Mouse<br/>
        ESC: Release cursor
      </p>
    </div>
  </div>

  <!-- Room name display -->
  <div id="room-label" class="hidden"></div>

  <!-- Artwork info panel -->
  <div id="artwork-panel" class="hidden">
    <h3 id="panel-title"></h3>
    <p id="panel-artist"></p>
    <p id="panel-desc"></p>
  </div>

  <!-- Crosshair -->
  <div id="crosshair">+</div>

  <!-- Minimap -->
  <canvas id="minimap" width="200" height="200"></canvas>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
