<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The First Message 💬</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .menu-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            color: #764ba2;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 999;
            font-weight: bold;
        }
        .menu-btn:hover { background: #764ba2; color: white; }

        /* Puzzle styles */
        .puzzle-container {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            color: white;
            max-width: 450px;
            width: 90%;
            z-index: 1;
        }
        .puzzle-container h2 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .puzzle-container p { opacity: 0.85; margin-bottom: 1.5rem; font-size: 1.1rem; }
        .puzzle-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }
        .puzzle-row label { font-size: 1rem; min-width: 60px; text-align: right; }
        select {
            padding: 0.6rem 1rem;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 1rem;
            font-family: 'Georgia', serif;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }
        select option { color: #333; background: white; }
        .submit-btn {
            margin-top: 1.5rem;
            background: white;
            color: #764ba2;
            border: none;
            padding: 0.8rem 2.5rem;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .submit-btn:hover { transform: scale(1.05); }
        .error { color: #ffb3c6; margin-top: 1rem; font-size: 0.95rem; }
        .hint { font-size: 0.85rem; opacity: 0.6; margin-top: 1rem; }

        /* Reveal styles */
        .reveal { display: none; text-align: center; color: white; padding: 2rem; z-index: 1; }
        .reveal.visible { display: block; animation: fadeInUp 1.5s ease; }
        .date-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-size: 1rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .reveal h1 { font-size: 2.8rem; margin-bottom: 1rem; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .time-display {
            font-size: 5rem;
            font-weight: bold;
            margin: 1.5rem 0;
            animation: glow 3s ease-in-out infinite;
        }
        .message-bubble {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem auto;
            max-width: 500px;
            animation: floatUp 3s ease-in-out infinite;
        }
        .message-bubble p { font-size: 1.3rem; line-height: 1.8; font-style: italic; }
        .subtitle { font-size: 1.2rem; opacity: 0.9; margin-top: 1.5rem; }
        .see-message-btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 1rem 2.5rem;
            background: white;
            color: #764ba2;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .see-message-btn:hover { transform: scale(1.08); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
        .sparkle {
            position: absolute;
            width: 4px; height: 4px;
            background: white;
            border-radius: 50%;
            animation: sparkle 4s linear infinite;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes glow { 0%,100% { text-shadow: 0 0 30px rgba(255,255,255,0.5); } 50% { text-shadow: 0 0 60px rgba(255,255,255,0.8), 0 0 100px rgba(255,255,255,0.4); } }
        @keyframes floatUp { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes sparkle { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 10% { opacity: 1; transform: translateY(80vh) scale(1); } 90% { opacity: 1; } 100% { transform: translateY(-10vh) scale(0); opacity: 0; } }
    </style>
</head>
<body>
    <button class="menu-btn" onclick="location.href='index.html'">🏠 Main Menu</button>

    <div class="puzzle-container" id="puzzle">
        <h2>💬 Unlock the Memory</h2>
        <p>When did I first text you?</p>
        <div class="puzzle-row">
            <label>Date:</label>
            <select id="day"></select>
            <select id="month">
                <option value="">Month</option>
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>
            <select id="year">
                <option value="">Year</option>
                <option value="2024">2024</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
            </select>
        </div>
        <div class="puzzle-row">
            <label>Time:</label>
            <select id="hour"></select>
            <span>:</span>
            <select id="minute"></select>
            <select id="ampm">
                <option value="AM">AM</option>
                <option value="PM">PM</option>
            </select>
        </div>
        <button class="submit-btn" onclick="checkAnswer()">Unlock 💜</button>
        <div id="error" class="error"></div>
        <p class="hint">Hint: Think back to that evening in May... ✨</p>
    </div>

    <div class="reveal" id="reveal">
        <div class="date-badge">📅 18th May 2025</div>
        <h1>💬 The First Message</h1>
        <div class="time-display">7:25 PM</div>
        <div class="message-bubble">
            <p>The moment everything began.<br><br>
            One message. One spark.<br>
            And then... us. 💜</p>
        </div>
        <a href="VT.html#d-day" class="see-message-btn">Click here to see the message 💌</a>
    </div>

    <script>
        // Populate dropdowns
        const dayEl = document.getElementById('day');
        dayEl.innerHTML = '<option value="">Day</option>';
        for (let i = 1; i <= 31; i++) dayEl.innerHTML += `<option value="${i}">${i}</option>`;

        const hourEl = document.getElementById('hour');
        hourEl.innerHTML = '<option value="">Hr</option>';
        for (let i = 1; i <= 12; i++) hourEl.innerHTML += `<option value="${i}">${i}</option>`;

        const minEl = document.getElementById('minute');
        minEl.innerHTML = '<option value="">Min</option>';
        for (let i = 0; i < 60; i += 5) minEl.innerHTML += `<option value="${i}">${String(i).padStart(2,'0')}</option>`;

        // Correct answer: 18 May 2026, 7:25 PM
        function checkAnswer() {
            const d = document.getElementById('day').value;
            const m = document.getElementById('month').value;
            const y = document.getElementById('year').value;
            const h = document.getElementById('hour').value;
            const min = document.getElementById('minute').value;
            const ap = document.getElementById('ampm').value;

            if (d == 18 && m == 5 && y == 2025 && h == 7 && min == 25 && ap == 'PM') {
                document.getElementById('puzzle').style.display = 'none';
                document.getElementById('reveal').classList.add('visible');
                for (let i = 0; i < 40; i++) {
                    const s = document.createElement('div');
                    s.className = 'sparkle';
                    s.style.left = Math.random() * 100 + '%';
                    s.style.animationDelay = Math.random() * 4 + 's';
                    s.style.animationDuration = (Math.random() * 3 + 3) + 's';
                    document.body.appendChild(s);
                }
            } else {
                document.getElementById('error').textContent = '❌ That\'s not it... try again, patootie!';
            }
        }
    </script>
</body>
</html>
